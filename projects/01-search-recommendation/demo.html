<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>校园二手交易平台搜索与推荐优化 - Demo</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#182b49;margin:0}.wrap{max-width:900px;margin:40px auto;padding:0 24px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #182b4914;margin:18px 0}.tag{color:#2457d6;font-weight:700}.metric{font-size:28px;color:#0d8a6a;font-weight:700}button{background:#2457d6;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}.result{margin-top:16px;padding:16px;background:#f0f5ff;border-radius:10px;display:none}</style></head><body><div class="wrap"><div class="tag">产品 Demo · 搜索 / 推荐 / 转化</div><h1>校园二手交易平台搜索与推荐优化</h1><p>让用户更快判断“这个结果值不值得点”，缩短从搜索到交易的路径。</p><div class="card"><h2>核心场景</h2><p>用户带着明确目标进入平台：想在一周内找到一台价格合适、距离较近的二手显示器。当前搜索结果混杂，商品标题不规范，关键信息藏在描述里。用户需要反复翻页、私聊确认，最终因为信息成本过高而放弃。</p><button onclick="showResult()">体验核心流程</button><div class="result" id="result">已完成一次核心流程。该 Demo 用于展示产品结构、关键交互和验证思路，完整 PRD 与数据结果见同目录文档。</div></div><div class="card"><h2>验证结果</h2><div class="metric">搜索点击率 42% → 58%；交易转化率 +18%；平均查找时间 -31%</div></div></div><script>function showResult(){document.getElementById('result').style.display='block'}</script></body></html>

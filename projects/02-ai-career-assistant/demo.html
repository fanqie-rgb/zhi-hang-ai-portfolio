<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 求职反馈助手产品设计 - Demo</title><style>body{font-family:Arial,"Microsoft YaHei",sans-serif;background:#f5f7fb;color:#182b49;margin:0}.wrap{max-width:900px;margin:40px auto;padding:0 24px}.card{background:#fff;border-radius:16px;padding:28px;box-shadow:0 8px 30px #182b4914;margin:18px 0}.tag{color:#2457d6;font-weight:700}.metric{font-size:28px;color:#0d8a6a;font-weight:700}button{background:#2457d6;color:white;border:0;padding:12px 18px;border-radius:8px;cursor:pointer}.result{margin-top:16px;padding:16px;background:#f0f5ff;border-radius:10px;display:none}</style></head><body><div class="wrap"><div class="tag">产品 Demo · AI 产品 / 大模型 / 工作流</div><h1>AI 求职反馈助手产品设计</h1><p>把“让 AI 改简历”变成可解释、可确认、可复盘的求职反馈工作流。</p><div class="card"><h2>核心场景</h2><p>用户准备投递一个产品实习岗位，上传简历后得到一段泛泛的评价：“建议突出项目成果”。用户不知道该改哪一段，也无法判断建议是否真的符合岗位要求。第二次打开产品时，之前的修改意见也没有被沉淀。</p><button onclick="showResult()">体验核心流程</button><div class="result" id="result">已完成一次核心流程。该 Demo 用于展示产品结构、关键交互和验证思路，完整 PRD 与数据结果见同目录文档。</div></div><div class="card"><h2>验证结果</h2><div class="metric">建议有帮助率 89%；简历修改完成率 47% → 76%；平均使用时长 14.2 分钟</div></div></div><script>function showResult(){document.getElementById('result').style.display='block'}</script></body></html>
